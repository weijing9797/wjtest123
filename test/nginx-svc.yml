apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: wj-test
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx


---
# Canary Service — 内部用，APISIX 分流到这里
apiVersion: v1
kind: Service
metadata:
  name: nginx-canary-svc
  namespace: wj-test
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: nginx
